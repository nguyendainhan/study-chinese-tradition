<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Inner Border for Traditional Style -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#fef08a" stroke-width="6" stroke-opacity="0.6"/>
  <!-- Traditional Chinese Character: 華 (Splendor / Chinese) -->
  <text x="256" y="340" 
        font-family="'Noto Serif TC', 'Songti TC', serif, sans-serif" 
        font-size="280" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#shadow)">華</text>
  <!-- Small Taiwan Emblem Tag -->
  <rect x="176" y="380" width="160" height="42" rx="21" fill="#fef08a" filter="url(#shadow)"/>
  <text x="256" y="408" 
        font-family="'Noto Sans TC', sans-serif" 
        font-size="20" 
        font-weight="bold" 
        fill="#991b1b" 
        text-anchor="middle" 
        letter-spacing="2">FORMOSA</text>
</svg>
